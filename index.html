<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <script src="script.js" defer></script>
    <title>Weather App</title>
  </head>
  <body>
    <main class="container">
      <section class="search-section">
        <input
          type="text"
          name="cityName"
          id="cityName"
          placeholder="Search City"
        />
        <span class="material-symbols-outlined loop" id="search"> search </span>
      </section>
      <section class="weather-container">
        <section class="city-name-date">
          <div class="location">
            <span class="material-symbols-outlined">location_on</span>
            <h2 id="city"></h2>
          </div>
          <h3 id="date"></h3>
        </section>
        <section class="global-weather">
          <img src="" alt="weather-condition" class="global-icon" />
          <div class="temperature-conditions">
            <h3 id="temp">4</h3>
            <p id="sky"></p>
          </div>
        </section>
        <section class="wind-humidity">
          <div class="details-container">
            <span class="material-symbols-outlined"> water_drop </span>
            <div>
              <h3>Humidity</h3>
              <p id="humidity"></p>
            </div>
          </div>
          <div class="details-container">
            <span class="material-symbols-outlined"> air </span>
            <div>
              <h3>Wind Speed</h3>
              <p id="wind"></p>
            </div>
          </div>
        </section>
        <section class="forcast">
          <div class="day-details">
            <h3></h3>
            <img src="" alt="" />
            <h4></h4>
          </div>
          <div class="day-details">
            <h3></h3>
            <img src="" alt="" />
            <h4></h4>
          </div>
          <div class="day-details">
            <h3></h3>
            <img src="" alt="" />
            <h4></h4>
          </div>
          <div class="day-details">
            <h3></h3>
            <img src="" alt="" />
            <h4></h4>
          </div>
          <div class="day-details">
            <h3></h3>
            <img src="" alt="" />
            <h4></h4>
          </div>
        </section>
      </section>
      <section class="search-message">
        <h1>Please Search for a city to Show Data</h1>
      </section>
      <section class="error-message">
        <h1>Oups City Not Found</h1>
      </section>
    </main>
  </body>
</html>
